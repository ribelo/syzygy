[[bench]]
name = "chain_vs_hashmap"
harness = false

[[bench]]
name = "event_dispatch_bench"
harness = false

[[bench]]
name = "channel_dispatch_bench"
harness = false

[[bench]]
name = "state_mutation_bench"
harness = false

[[bench]]
name = "hlist_boxed_bench"
harness = false

[[bench]]
name = "hlist_optimized_bench"
harness = false

[[bench]]
name = "trait_dispatch_bench"
harness = false

[[test]]
