[workspace]
members = ["crates/syzygy-macros"]
resolver = "2"

[package]
name = "syzygy"
version = "0.1.0"
edition = "2021"
description = "Zero-overhead TEA for Rust: pure Core, async Shell, and explicit Commands/Tasks for side effects."
license = "Unlicense"
repository = "https://github.com/ribelo/syzygy"
homepage = "https://github.com/ribelo/syzygy"
documentation = "https://docs.rs/syzygy"
readme = "README.md"
keywords = ["tea", "state", "architecture", "async", "effects"]
categories = ["asynchronous", "rust-patterns"]
rust-version = "1.75"

[lib]
path = "src/lib.rs"
doctest = false

[[example]]
name = "01_basic_counter"
required-features = ["shell"]

[[example]]
name = "02_field_extraction"
required-features = ["shell"]

[[example]]
name = "03_child_models"
required-features = ["shell"]

[[example]]
name = "04_async_effects"
required-features = ["shell"]

[[example]]
name = "05_stream_effects"
required-features = ["shell"]

[[example]]
name = "06_resources"
required-features = ["shell"]

[[example]]
name = "07_testing"
required-features = ["shell"]

[[example]]
name = "08_command_composition"
required-features = ["shell"]

[[example]]
name = "09_error_handling"
required-features = ["shell"]

[[example]]
name = "10_todo_app"
required-features = ["shell"]

[[example]]
name = "11_process_tasks"
required-features = ["shell"]

[[example]]
name = "12_subscriptions"
required-features = ["shell"]

[features]
default = ["shell", "rt-compio"]
shell = ["dep:async-process", "dep:futures"]
rt-compio = ["dep:compio"]
rt-tokio = ["dep:tokio"]
examples = ["shell"]
tracing = ["dep:tracing"]

[dependencies]
async-process = { version = "2.5", optional = true }
thiserror = "2.0"
futures = { version = "0.3", optional = true }
smallvec = "1.13"
rustc-hash = "2.0"
crossbeam-channel = "0.5"
compio = { version = "0.18", features = ["runtime", "macros", "time"], optional = true }
tokio = { version = "1.35", features = ["rt", "time", "macros", "sync"], optional = true }
tracing = { version = "0.1", optional = true }
syzygy-macros = { path = "crates/syzygy-macros" }

[dev-dependencies]
futures = "0.3"

[lints.clippy]
all = { level = "warn", priority = -2 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
clone_on_ref_ptr = "warn"
self_named_module_files = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
filetype_is_file = "warn"
get_unwrap = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
unnecessary_safety_comment = "warn"
undocumented_unsafe_blocks = "warn"
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
similar-names = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
doc_markdown = "allow"
needless_pass_by_value = "allow"
missing_const_for_fn = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_bound_locations = "allow"
