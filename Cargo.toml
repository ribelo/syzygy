
[package]
name = "syzygy"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[features]
default = ["async"]
async = ["dep:tokio", "dep:tokio-util"]
parallel = ["dep:rayon"]
tracing = ["dep:tracing", "dep:uuid"]

[dependencies]
thiserror = "2.0"
rustc-hash = "2"
smallvec = "1.13"
arrayvec = "0.7"
rayon = { version = "1.10", optional = true }
tokio = { version = "1.4", features = ["full"], optional = true }
tokio-util = { version = "0.7", features = ["rt"], optional = true }
tracing = { version = "0.1", optional = true, default-features = false, features = ["std", "attributes"] }
uuid = { version = "1.0", optional = true, features = ["v4"] }
log = "0.4"
bon = "3.3"
derive_more = { version = "2.0", features = ["full"] }
crossbeam-channel = "0.5.14"

[dev-dependencies]
cfg-if = "1.0.0"
criterion = { version = "0.5", features = ["html_reports"] }
futures = "0.3"
enum_dispatch = "0.3"
ambassador = "0.4"
frunk = "0.4"
frunk_core = "0.4"
cucumber = "0.21"


