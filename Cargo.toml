
[package]
name = "syzygy"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"
doctest = false

[features]
default = ["tokio"]
tokio = ["dep:tokio", "dep:tokio-util"]
smol = ["dep:smol", "dep:async-channel"]
async-std = ["dep:async-std", "dep:async-channel"]
view-model = []
multi-model = []
tracing = ["dep:tracing"]
magic-compilation-test = []
manual-compilation-test = []
rayon = ["dep:rayon"]
examples = []
legacy_tests = []

[dependencies]
# Core dependencies
thiserror = "2.0"
crossbeam-channel = "0.5"
futures = "0.3"
futures-util = "0.3"
futures-concurrency = "7.6"
smallvec = "1.13"
rustc-hash = "2.0"
rayon = { version = "1.9", optional = true }

# Runtime dependencies
tokio = { version = "1.40", features = ["rt", "rt-multi-thread", "sync", "time", "macros"], optional = true }
tokio-util = { version = "0.7", features = ["rt"], optional = true }
smol = { version = "2.0", optional = true }
async-std = { version = "1.13", optional = true }
async-channel = { version = "2.3", optional = true }

# Tracing dependencies
tracing = { version = "0.1", optional = true }

# Macro dependencies
syzygy_macros = { path = "crates/syzygy_macros" }

[dev-dependencies]
cfg-if = "1.0.0"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
futures = "0.3"
enum_dispatch = "0.3"
ambassador = "0.4"
frunk = "0.4"
frunk_core = "0.4"
cucumber = "0.21"
heapless = "0.8"
micromap = "0.1"
enum-map = "2.7"
indexmap = "2.0"
ahash = "0.8"
proptest = "1.4"
tokio-test = "0.4"
rand = "0.8"
syzygy_macros = { path = "crates/syzygy_macros" }

# BDD tests removed - were using outdated API incompatible with current architecture

# Temporarily disabled - outdated benchmarks moved to outdated_code/
# [[bench]]
# name = "dispatch_benchmark"
# harness = false

# [[bench]]
# name = "model_storage_benchmark"
# harness = false


[lints.clippy]
all = { level = "warn", priority = -2 }

# restriction
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# I like the explicitness of this rule as it removes confusion around `clone`.
# This increases readability, avoids `clone` mindlessly and heap allocating on accident.
clone_on_ref_ptr = "warn"

# These two are mutually exclusive, I like `mod.rs` files for better fuzzy searches on module entries.
self_named_module_files = "warn"         # "-Wclippy::mod_module_files"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
filetype_is_file = "warn"
get_unwrap = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
unnecessary_safety_comment = "warn"
undocumented_unsafe_blocks = "warn"

# I want to write the best Rust code so pedantic is enabled.
# We should only disable rules globally if they are either false positives, chaotic, or does not make sense.
pedantic = { level = "warn", priority = -1 }

# Allowed rules
# pedantic
# This rule is too pedantic, I don't want to force this because naming things are hard.
module_name_repetitions = "allow"
similar-names = "allow"

# All triggers are mostly ignored in this codebase, so this is ignored globally.
struct_excessive_bools = "allow"
too_many_lines = "allow"
doc_markdown = "allow"

# Domain-specific: Events are consumed by exactly one handler and often need their data moved
# to Commands, making pass-by-value more efficient than borrow+clone patterns.
needless_pass_by_value = "allow"

# nursery
# `const` functions do not make sense for our project because this is not a `const` library.
# This rule also confuses new comers and forces them to add `const` blindlessly without any reason.
missing_const_for_fn = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

multiple_bound_locations = "allow"


[[bench]]
name = "command_performance"
harness = false

# Removed broken benchmarks that tested outdated APIs

# Only build examples when the `examples` feature is enabled
[[example]]
name = "01_basic_tea"
required-features = ["examples"]

[[example]]
name = "04_async_effects"
required-features = ["examples"]


[[example]]
name = "06_effects_coordination"
required-features = ["examples"]

[[example]]
name = "database_effects"
required-features = ["examples"]

[[example]]
name = "07_final_example"
required-features = ["examples"]
